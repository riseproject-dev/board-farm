# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-zhihe"
BBFILE_PATTERN_meta-zhihe = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-zhihe = "6"

LAYERDEPENDS_meta-zhihe = "core"
LAYERSERIES_COMPAT_meta-zhihe = "scarthgap blacksail"
