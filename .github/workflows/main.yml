name: Phase 1 Labgrid Pilot Kernel Test (QEMU Experiment)

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Target machine/role to test on
        required: true
        default: 'qemu-board-01'
        type: string
  issue_comment:
    types: [created]

jobs:
  build:
    name: Build Kernel / FIT Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build FIT Image (Simulated)
        run: |
          mkdir -p build
          echo "Simulated RISC-V FIT Image Binary Data" > build/fitImage

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: build/fitImage

  test-hw:
    name: Boot & Test Kernel via Labgrid
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment && startsWith(github.event.comment.body, '/run-kernel-tests'))
    needs: build
    runs-on: [self-hosted, board-farm-controller]
    concurrency:
      group: board-farm-${{ inputs.machine || 'qemu-board-01' }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Kernel Artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-image
          path: /tmp/tftp/${{ inputs.machine || 'qemu-board-01' }}/

      - name: Execute Hardware Test Suite
        run: |
          /opt/venv/bin/pytest -s \
            --lg-env=experiment/gha-test/lab_env.yaml \
            --junitxml=results.xml \
            experiment/gha-test/tests/test_kernel.py

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-results-action@v2
        if: always()
        with:
          files: "results.xml"
