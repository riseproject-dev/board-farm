name: A210 Labgrid Native UBoot Netboot (OSU OSL)

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target A210 board to test'
        required: true
        default: 'a210-board-02'
        type: choice
        options:
          - a210-board-02
          - a210-board-01

jobs:
  labgrid-uboot-netboot:
    name: Run Native Labgrid UBootDriver TFTP Netboot
    runs-on: [self-hosted, board-farm-controller]
    concurrency:
      group: board-farm-${{ inputs.board }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Labgrid Environment
        run: |
          echo "=========================================================="
          echo " Target Board: ${{ inputs.board }}"
          echo " Controller Host: $(hostname)"
          echo "=========================================================="
          export LG_CROSSBAR="ws://127.0.0.1:20408/ws"
          labgrid-client places || true

      - name: Execute Pytest Suite with Native Labgrid UBootDriver
        run: |
          BOARD="${{ inputs.board }}"
          export LG_CROSSBAR="ws://127.0.0.1:20408/ws"

          ENV_FILE="experiment/osu_osl/lab_env_native_uboot_${BOARD}.yaml"
          TEST_FILE="experiment/osu_osl/tests/test_native_uboot_netboot.py"

          # Fallback paths for mounted workspace
          if [ ! -f "$ENV_FILE" ]; then
            if [ -f "/workspace/phase2_test/lab_env_native_uboot_${BOARD}.yaml" ]; then
              ENV_FILE="/workspace/phase2_test/lab_env_native_uboot_${BOARD}.yaml"
              TEST_FILE="/workspace/phase2_test/tests/test_native_uboot_netboot.py"
            fi
          fi

          echo "Executing Pytest: $TEST_FILE with $ENV_FILE"
          pytest -v -s \
            --lg-env="$ENV_FILE" \
            --junitxml=labgrid_uboot_results.xml \
            "$TEST_FILE"

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.board }}-labgrid-uboot-results
          path: labgrid_uboot_results.xml
